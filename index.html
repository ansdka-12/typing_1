<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>타자 연습 - 학생 등록</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f8fafc; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
    h2 { margin-bottom: 20px; color: #1e293b; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>타자 연습 시작하기</h2>
    <form id="studentForm">
      <input type="text" id="studentId" placeholder="학번 (예: 10101)" required>
      <input type="text" id="studentName" placeholder="이름 (예: 홍길동)" required>
      <button type="submit" id="startBtn">입장 및 연습 시작</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // teacher_2.html에 사용된 동일한 Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCbD3IZgib2KCETLMqP2zMH2_WVVdxfsmk",
      authDomain: "test-26-01-20.firebaseapp.com",
      projectId: "test-26-01-20",
      storageBucket: "test-26-01-20.firebasestorage.app",
      messagingSenderId: "1046847215998",
      appId: "1:1046847215998:web:f9ce56e45c28c4e61f7b2f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const studentId = document.getElementById("studentId").value.trim();
      const studentName = document.getElementById("studentName").value.trim();
      const fullName = `${studentId} ${studentName}`;
      
      // 학번을 문서 ID로 지정하여 중복 생성 방지
      const docRef = doc(db, "typing_records", studentId);
      
      try {
        // Firebase에 "진행 중" 상태 기록
        await setDoc(docRef, {
          name: fullName,
          status: "진행 중",
          cpm: 0,
          timestamp: new Date()
        });

        // 학번과 이름을 URL 파라미터로 넘기며 타자 연습 화면으로 이동
        window.location.href = `typing_jem_1.html?id=${encodeURIComponent(studentId)}&name=${encodeURIComponent(fullName)}`;
      } catch (error) {
        alert("등록 중 오류가 발생했습니다: " + error.message);
      }
    });
  </script>
</body>
</html>
