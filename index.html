<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>C프로그래밍 타자 연습 - 학생 등록</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
    h2 { text-align: center; color: #1e293b; margin-bottom: 20px; }
    label { font-weight: bold; color: #475569; display: block; margin-top: 12px; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>타자 연습 시작하기</h2>
    <form id="loginForm">
      <label for="roomName">교실 선택</label>
      <select id="roomName" required>
        <option value="">교실을 선택하세요</option>
        <option value="한일">한일</option>
        <option value="로봇">로봇</option>
      </select>

      <label for="studentId">학번</label>
      <input type="text" id="studentId" placeholder="예: 20315" required>

      <label for="studentName">이름</label>
      <input type="text" id="studentName" placeholder="예: 홍길동" required>

      <button type="submit">연습 시작하기</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCbD3IZgib2KCETLMqP2zMH2_WVVdxfsmk",
      authDomain: "test-26-01-20.firebaseapp.com",
      projectId: "test-26-01-20",
      storageBucket: "test-26-01-20.firebasestorage.app",
      messagingSenderId: "1046847215998",
      appId: "1:1046847215998:web:f9ce56e45c28c4e61f7b2f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const roomName = document.getElementById("roomName").value;
      const studentId = document.getElementById("studentId").value.trim();
      const studentName = document.getElementById("studentName").value.trim();

      const docId = studentId;

      try {
        await setDoc(doc(db, "typing_records", docId), {
          roomName: roomName,
          studentId: studentId,
          name: studentName,
          status: "진행 중",
          timestamp: serverTimestamp()
        });

        window.location.href = `typing_jem_1.html?id=${encodeURIComponent(docId)}&name=${encodeURIComponent(studentName)}&room=${encodeURIComponent(roomName)}`;
      } catch (error) {
        console.error("등록 중 오류 발생:", error);
      }
    });
  </script>
</body>
</html>
