<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타자 연습</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 550px;
      text-align: center;
    }
    .user-info {
      font-size: 18px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 25px;
      background: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
    }
    .target-text {
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
      background: #f8fafc;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #94a3b8;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      text-align: center;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .stats {
      margin-top: 25px;
      display: flex;
      justify-content: space-around;
      font-size: 18px;
      font-weight: bold;
      color: #475569;
    }
    .result-box {
      margin-top: 25px;
      padding: 15px;
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="user-info" id="studentDisplay">학생 정보 확인 중...</div>
    
    <div class="target-text" id="targetText">동해물과 백두산이 마르고 닳도록</div>

    <input type="text" id="inputField" placeholder="위 문장을 똑같이 입력하고 Enter를 누르세요" autocomplete="off">

    <div class="stats">
      <div>현재 타수: <span id="cpmDisplay">0</span> CPM</div>
      <div>경과 시간: <span id="timerDisplay">0</span>초</div>
    </div>

    <div class="result-box" id="resultBox">
      🎉 연습이 완료되었습니다! 기록이 교사 현황판으로 전송되었습니다.
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCbD3IZgib2KCETLMqP2zMH2_WVVdxfsmk",
      authDomain: "test-26-01-20.firebaseapp.com",
      projectId: "test-26-01-20",
      storageBucket: "test-26-01-20.firebasestorage.app",
      messagingSenderId: "1046847215998",
      appId: "1:1046847215998:web:f9ce56e45c28c4e61f7b2f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. URL 파라미터 수신 (학번/이름)
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');
    const studentName = urlParams.get('name');

    if (!studentId || !studentName) {
      alert("학생 정보를 먼저 입력해야 합니다.");
      window.location.href = "index.html";
    } else {
      document.getElementById("studentDisplay").innerText = `학생: ${studentName}`;
    }

    // 3. 타자 연습 예시 문장 목록
    const sentences = [
      "동해물과 백두산이 마르고 닳도록",
      "하느님이 보우하사 우리나라 만세",
      "무궁화 삼천리 화려 강산",
      "대한 사람 대한으로 길이 보전하세"
    ];

    let currentSentenceIndex = 0;
    let startTime = null;
    let timerInterval = null;
    let totalTypedChars = 0;
    let isCompleted = false;

    const targetTextEl = document.getElementById("targetText");
    const inputField = document.getElementById("inputField");
    const cpmDisplay = document.getElementById("cpmDisplay");
    const timerDisplay = document.getElementById("timerDisplay");
    const resultBox = document.getElementById("resultBox");

    targetTextEl.innerText = sentences[currentSentenceIndex];

    // 입력 시작 시 타이머 가동
    inputField.addEventListener("input", () => {
      if (isCompleted) return;

      if (!startTime) {
        startTime = new Date();
        timerInterval = setInterval(updateStats, 100);
      }
    });

    // Enter 키로 문장 판정 및 다음 문장 이동
    inputField.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && !isCompleted) {
        const typedText = inputField.value.trim();
        const currentTarget = sentences[currentSentenceIndex];

        if (typedText === currentTarget) {
          totalTypedChars += currentTarget.length;
          currentSentenceIndex++;

          if (currentSentenceIndex < sentences.length) {
            targetTextEl.innerText = sentences[currentSentenceIndex];
            inputField.value = "";
          } else {
            finishTyping();
          }
        }
      }
    });

    // 실시간 타수 및 소요 시간 업데이트
    function updateStats() {
      if (!startTime || isCompleted) return;

      const currentTime = new Date();
      const timeElapsedInSeconds = (currentTime - startTime) / 1000;
      const currentInputChars = inputField.value.length;

      const currentCpm = Math.round(((totalTypedChars + currentInputChars) / timeElapsedInSeconds) * 60);

      timerDisplay.innerText = Math.floor(timeElapsedInSeconds);
      cpmDisplay.innerText = isNaN(currentCpm) ? 0 : currentCpm;
    }

    // 연습 완료 처리 및 Firebase 데이터 업로드
    async function finishTyping() {
      isCompleted = true;
      clearInterval(timerInterval);
      inputField.disabled = true;

      const finalTimeInSeconds = Math.round((new Date() - startTime) / 1000); // 총 연습시간(초)
      const finalCpm = Math.round((totalTypedChars / (finalTimeInSeconds || 1)) * 60);

      // 현재 시각 계산 (HH:MM:SS)
      const now = new Date();
      const endTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      cpmDisplay.innerText = finalCpm;
      resultBox.style.display = "block";

      try {
        const docRef = doc(db, "typing_records", studentId);
        await updateDoc(docRef, {
          status: "완료",
          cpm: finalCpm,
          elapsedTime: finalTimeInSeconds, // 총 연습시간(초)
          endTime: endTimeStr              // 완료 시각
        });
      } catch (error) {
        console.error("결과 전송 중 오류 발생:", error);
      }
    }
  </script>
</body>
</html>
